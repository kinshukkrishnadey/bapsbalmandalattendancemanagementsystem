spring.application.name=balbalika-management-system

server.port = 3900

# MySQL - override with application-local.properties or env vars DB_USERNAME, DB_PASSWORD
spring.datasource.url= jdbc:mysql://localhost:3306/bapsdelhibalmandal
spring.datasource.username= ${DB_USERNAME:root}
spring.datasource.password= ${DB_PASSWORD:rootuser}

# Load local overrides from project root (create from application-local.properties.example)
spring.config.import=optional:file:./application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT - use environment variable JWT_SECRET in production
jwt.secret= ${JWT_SECRET:change-this-in-production-use-env-var}
jwt.expiration-ms= 3600000

# CORS - comma-separated list of allowed origins (e.g. http://localhost:3000,https://app.example.com)
app.cors.allowed-origins= ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3900}

# Security - set to false for stateless JWT APIs (token in Authorization header)
app.security.csrf.enabled= ${CSRF_ENABLED:false}

# OTP - expiry in seconds
app.otp.expiry-seconds= 300
# Return OTP in response (for dev/testing only - set to false in production)
app.otp.return-in-response= false

# SMS Provider Configuration (Twilio for Indian numbers)
# Enable SMS service (set to true when SMS provider is configured)
sms.provider.enabled= false
# Twilio Account SID (get from https://www.twilio.com/console)
sms.provider.account-sid= ${TWILIO_ACCOUNT_SID:}
# Twilio Auth Token (get from https://www.twilio.com/console)
sms.provider.auth-token= ${TWILIO_AUTH_TOKEN:}
# Twilio From Number (your Twilio phone number in E.164 format, e.g., +919876543210 or +15551234567)
sms.provider.from-number= ${TWILIO_FROM_NUMBER:}

# Dev seed (local only): ensure admin role/user exists for testing secured endpoints
app.dev.seed-admin= true
app.dev.admin-phone= 9876543210

# GCP Bucket
gcp.bucket.name=${GCP_BUCKET_NAME:baps-child-photos}
# Signed URL expiration time in hours (default: 24 hours)
gcp.signed.url.expiration.hours=${GCP_SIGNED_URL_EXPIRATION_HOURS:24}
# Credentials priority: 1) GCP_CREDENTIALS_JSON env var, 2) GCP_CREDENTIALS_PATH env var, 3) this property
# For Docker/Kubernetes: Use GCP_CREDENTIALS_JSON (JSON string) or GCP_CREDENTIALS_PATH (mounted secret file path)
gcp.credentials.path=${GCP_CREDENTIALS_PATH:classpath:gcs-service-account.json}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# SpringDoc Configuration - temporarily disabled to test multipart issue
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
