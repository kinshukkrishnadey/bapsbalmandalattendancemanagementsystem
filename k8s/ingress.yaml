apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: balbalika-ingress
  namespace: default
  annotations:
    # For cloud providers, use their ingress controller
    # For example, on GKE:
    # kubernetes.io/ingress.class: "gce"
    # kubernetes.io/ingress.global-static-ip-name: "balbalika-ip"
    
    # For NGINX Ingress Controller (common for on-prem/minikube):
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    
    # For cert-manager (if using SSL):
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # For production, use TLS:
  # tls:
  # - hosts:
  #   - api.your-domain.com
  #   secretName: balbalika-tls
  rules:
  - host: api.your-domain.com  # Change to your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: balbalika-management-system
            port:
              number: 80
